name: malssi
description: A Flutter application for quote sharing
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  go_router: ^13.2.0
  firebase_core: ^2.24.2
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  share_plus: ^10.1.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod: ^2.4.9
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/docs/
    - assets/fonts/
    - assets/images/
    - assets/images/screenshots/

  fonts:
    - family: Galmuri11
      fonts:
        - asset: assets/fonts/Galmuri11.ttf
        - asset: assets/fonts/Galmuri11-Bold.ttf
          weight: 700