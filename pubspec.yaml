name: malssi
description: A Flutter application for quote sharing
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.13.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  go_router: ^13.2.0
  firebase_core: ^2.24.2
  flutter_local_notifications: ^16.1.0
  timezone: ^0.9.4
  share_plus: ^10.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  riverpod: ^2.4.9
  build_runner: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: NotoSerifKR
      fonts:
        - asset: assets/fonts/NotoSerifKR.ttf